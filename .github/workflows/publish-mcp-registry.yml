name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication to prove namespace ownership
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mcp-publisher CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          echo "Downloading $archive for $MCP_PUBLISHER_VERSION..."
          gh release download "$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry --pattern "$archive" --clobber
          tar -xzf "$archive"
          chmod +x mcp-publisher
          ./mcp-publisher --help

      - name: Validate server.json schema
        run: |
          echo "Validating server.json..."
          ./mcp-publisher validate server.json

      - name: Authenticate via GitHub OIDC
        run: |
          echo "Authenticating via GitHub OIDC..."
          ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: |
          echo "Publishing server to official MCP Registry..."
          ./mcp-publisher publish server.json
