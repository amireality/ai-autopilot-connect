name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication to prove namespace ownership
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mcp-publisher CLI
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --show-error --output "$archive" "$base_url/$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"
          chmod +x mcp-publisher

      - name: Validate server.json schema
        run: ./mcp-publisher validate --path server.json

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish --path server.json
